# Option names: verified against go-librespot v0.10.x schema
log_level: info
device_name: "${SPOTIFY_DEVICE_NAME}"
device_type: speaker

audio_backend: alsa
audio_device: default


bitrate: 320                 # Premium
volume_steps: 100
initial_volume: ${INITIAL_VOLUME}
normalisation_enabled: true

zeroconf_enabled: false    # Dedicated bot mode: keep device paired permanently without auto-logout

credentials:
  type: device_auth          # Direct pairing via spotify.com/pair; credentials persist in /data/librespot

server:                      # local control API used by the controller
  enabled: true
  address: 127.0.0.1
  port: 3678
